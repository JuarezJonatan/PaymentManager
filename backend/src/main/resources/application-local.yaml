spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:payment_manager}
    username: ${POSTGRES_USER:payment_manager}
    password: ${POSTGRES_PASSWORD:payment_manager}
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed
