name: payment-manager

include:
  - payment-manager-api/compose.yaml

services:
  api:
    build: payment-manager-api
    container_name: payment-manager-api
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: payment-manager-frontend
    container_name: payment-manager-web
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api
